  - id: c12
    title: "陷入问题行为的儿童——特别优秀 vs 特别差劲"
    type: case
    source_chapter: "51 追求理想者面前的两条路"
    source_quote: "大多数孩子在最初的阶段都是希望特别优秀……但是希望特别优秀的愿望无法实现的时候……就会转而希望特别差劲。"
    summary: "哲人分析问题行为的心理机制：孩子最初都希望'特别优秀'（获得父母认可），当此路不通时便转向'特别差劲'——通过扔橡皮、大声说话、逃学、割腕等行为引起关注。两者目的相同：脱离普通，成为'特别的存在'。后者被阿德勒称为'廉价的优越性追求'。"
    bound_to: "廉价的优越性追求（追求理想者面前的两条路）"
    outcome: "揭示问题行为的本质：无论被训斥与否，孩子都在通过不良行为获得关注——训斥本身也是一种关注，反而可能强化行为。"
    tags: ["问题行为", "优越性追求", "特别差劲", "关注", "教育"]

  - id: c13
    title: "洗碗的妻子——他者贡献的两种态度"
    type: case
    source_chapter: "48 年轻人也有胜过长者之处"
    source_quote: "在某个家庭里，晚饭结束之后餐桌上满是餐具。孩子们回到了自己的房间里，丈夫坐在沙发上看电视，只有妻子一个人在收拾……如果是一边愉快地哼着歌一边洗餐具，孩子们也许会过来帮忙。"
    summary: "哲人描述的家庭场景：妻子独自收拾晚餐餐具，家人无人帮忙。若妻子边抱怨边做，全家都不愿靠近；若她愉快哼歌地洗，孩子们反而可能来帮忙。核心在于：能否把家人视为伙伴。若视为敌人（'为什么只有我做'），则贡献是伪善；若视为伙伴，则贡献是自然且带来喜悦的。"
    bound_to: "他者贡献（视他人为伙伴 vs 视他人为敌人）"
    outcome: "哲人结论：贡献感是主观的，只要将他人视为伙伴，就能从贡献中体会价值，无需他人的感谢或认可。"
    tags: ["他者贡献", "伙伴", "家庭关系", "奉献精神", "伪善"]
