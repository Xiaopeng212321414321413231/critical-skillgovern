    summary: "哲人分享自身经历：曾因身高155cm而自卑，认为再长高10cm一切都会不同。朋友指出'你可有让人感觉轻松的本事'——高大者给人压迫感，而矮小的他却能让对方放下警惕。经此启发，哲人完成了价值的转换，不再为身高烦恼。"
