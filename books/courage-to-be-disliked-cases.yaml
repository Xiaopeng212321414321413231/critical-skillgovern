  - id: c09
    title: "青年祖父卧病在床——存在价值的追问"
    type: case
    source_chapter: "42 只要存在着，就有价值"
    source_quote: "我祖父现在在养老院里过着卧病在床的生活。因为认知障碍就连儿孙都不认识了。如果没人照顾就根本活不下去。不管怎么想都好像对别人没有什么用。"
    summary: "青年以自己祖父为反例质疑：祖父因认知障碍卧床不起，连儿孙都不认识、靠人照顾，按照'对别人有用才有价值'的逻辑，岂不是毫无价值。哲人回应：请不要用'行为标准'而要用'存在标准'去衡量——仅凭'活着'本身，就对家人有巨大价值（如病危时'只要活着就谢天谢地'的心情）。"
    bound_to: "存在标准 vs 行为标准（只要存在着，就有价值）"
    outcome: "哲人提出存在标准：不要用'做了什么'去评价人，而应对其存在本身表示喜悦和感谢。"
    tags: ["存在标准", "行为标准", "价值", "老人", "生命"]

  - id: c10
    title: "工作狂父亲——缺乏人生和谐"
    type: case
    source_chapter: "49 '工作狂'是人生谎言"
    source_quote: "我父亲就是这样的人。他是个工作狂，一心只想着在工作上出成绩，并且还以自己挣钱为理由来支配家人，是个非常封建的人。"
    summary: "青年讲述父亲的案例：父亲是工作狂，以挣钱养家为由支配家人，不接受反驳（'你是靠谁才吃上饭的'）。哲人解析：这是缺乏'人生和谐'的生活方式——只关注工作这一侧面，用行为标准（挣钱多少）来认可自己的价值，逃避家务、育儿、交友等其他人生课题。一旦退休或无法劳动，便会遭受严重打击。"
    bound_to: "人生和谐（缺乏人生和谐的生活方式）"
    outcome: "哲人指出：工作只是人生一部分，只关注公司工作是逃避其他人生课题的人生谎言。应以存在标准而非仅以行为标准认可自己的价值。"
    tags: ["工作狂", "人生和谐", "行为标准", "逃避课题", "家庭关系"]

  - id: c11
    title: "口吃者与研讨会上的等待"
    type: case
