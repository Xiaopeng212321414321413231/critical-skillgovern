    source_quote: "那时来了一位女学生……他的苦恼是害怕见人，一到人前就脸红。说是无论如何都想治好这种脸红恐惧症。……她告诉我说自己有一个想要交往的男孩。"
    summary: "哲人曾咨询的案例：女学生因脸红恐惧症而无法向喜欢的男孩告白。哲人判断她需要这个症状——只要有脸红恐惧症在，她就可以用'因为脸红才不能告白'来自我逃避，避免承受被拒绝的打击。哲人不直接治疗症状，而是帮助她建立向前迈进的勇气。"
    bound_to: "目的论 / 自卑感与逃避（为什么要讨厌自己？）"
    outcome: "女孩最终和朋友一起与男孩出去玩，男孩先向她告白了。症状不再被需要。"
