    type: case
    source_chapter: "02 再怎么'找原因'，也没法改变一个人"
    source_quote: "我的朋友中有一位多年躲在自己房间中闭门不出的男子。他很希望到外面去，如果可以的话还想要像正常人一样拥有一份工作。他很想改变目前的自己。"
    summary: "青年分享的朋友案例：一名男子常年闭门不出，想工作但恐惧外出，一踏出房间就心悸发抖。青年认为这是过去的心灵创伤所致，但哲人用目的论解释——他是因为'不想出去'才制造了不安情绪，以此获得父母的关注和照顾。"
    bound_to: "目的论（目的论 vs 原因论）"
    outcome: "揭示目的论视角：症状（闭门不出）是为达成某种目的（获得关注、逃避社会评价）而制造出来的，而非过去创伤的直接结果。"
    tags: ["目的论", "原因论", "逃避", "人际关系"]

