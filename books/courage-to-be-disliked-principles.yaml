# 《被讨厌的勇气》原则、清单、规则与断言提取
# 原文：《被讨厌的勇气》——岸见一郎 / 古贺史健
# 基于阿德勒心理学

---
- id: p01
  title: 目的论——一切行为皆有目的
  type: principle
  source_chapter: 03 再怎么"找原因"，也没法改变一个人
  source_quote: "阿德勒心理学考虑的不是过去的原因，而是现在的目的。你的朋友并不是因为不安才无法走出去的。事情的顺序正好相反，我认为他是由于不想到外面去，所以才制造出不安情绪。"
  summary: 人的行为不是由过去的原因决定的，而是为了达成当下的目的。愤怒、不安等情绪都是为达到某种目的而制造的手段，而非不可抗拒的客观反应。
  tags: ["目的论", "情绪", "行为动机", "阿德勒心理学"]

- id: p02
  title: 心理创伤并不存在——经历的意义由你赋予
  type: assertion
  source_chapter: 04 心理创伤并不存在
  source_quote: "任何经历本身并不是成功或者失败的原因。我们并非因为自身经历中的刺激——所谓的心理创伤——而痛苦。事实上我们会从经历中发现符合自己目的的因素。决定我们自身的不是过去的经历，而是我们自己赋予经历的意义。"
  summary: 经历本身不决定人格或命运，真正决定人生的是你如何解读和利用那些经历。这不是否认创伤事件的存在，而是强调人对意义的自主权。
  tags: ["心理创伤", "原因论", "意义赋予", "自主权"]

- id: p03
  title: 一切烦恼皆源于人际关系
  type: assertion
  source_chapter: 12 一切烦恼都是人际关系的烦恼
  source_quote: "人的烦恼皆源于人际关系。如果这个世界没有人际关系，如果这个宇宙中没有他人只有自己，那么一切烦恼也都将消失。"
  summary: 阿德勒心理学的基本公理：所有烦恼——自卑、孤独、焦虑、嫉妒——本质上都源于人与他人的关系。孤独感需要他人的存在才能成立，自卑感在比较中产生，幸福也唯有在人际关系中才能实现。
  tags: ["人际关系", "烦恼根源", "孤独", "自卑"]

- id: p04
  title: 自卑感≠自卑情结——自卑是成长的催化剂
  type: rule
  source_chapter: 14 自卑情结只是一种借口
  source_quote: "无论是追求优越性还是自卑感，都不是病态，而是一种能够促进健康、正常的努力和成长的刺激。只要处理得当，自卑感也可以成为努力和成长的催化剂。"
  summary: 自卑感（认识到不足并努力改进）是健康的成长动力。自卑情结（把不足当借口逃避行动）才是问题。区分两者的关键在于是否用"因为有A所以才做不到B"的因果律来逃避行动。
  tags: ["自卑感", "自卑情结", "成长", "外部因果律"]

- id: p05
  title: 课题分离——你必须只管自己的课题
  type: principle
  source_chapter: 23 把自己和别人的"人生课题"分开来
  source_quote: "别人的事和我的事要分清楚。关于某种选择所带来的结果最终由谁来承担，就是谁的课题。你可以把马带到水边，但不能强迫它喝水。"
  summary: 区分"自己的课题"和"他人的课题"——最终后果由谁承担就是谁的课题。不去干涉他人的课题，也不让他人干涉自己的课题。这是人际关系的基本界限，也是通往自由的第一步。
  tags: ["课题分离", "边界", "人际关系", "自由"]

- id: p06
  title: 自由就是被人讨厌——不惧他人评价
  type: principle
  source_chapter: 28 自由就是被别人讨厌
  source_quote: "自由就是被别人讨厌。不畏惧被人讨厌而是勇往直前，不随波逐流而是激流勇进，这才是对人而言的自由。"
  summary: 追求自由必然付出"被某些人讨厌"的代价。如果你不被人讨厌，说明你活在别人的期待中。自由不是满足所有人的期待，而是有勇气承受不被部分人喜欢的结果。
  tags: ["自由", "被讨厌", "勇气", "他人评价"]

- id: p07
  title: 否定寻求认可——不用他人的标准过自己的人生
  type: rule
  source_chapter: 26 要不要活在别人的期待中？
  source_quote: "我们并不是为了满足别人的期待而活着。如果一味寻求别人的认可、在意别人的评价，那最终就会活在别人的人生中。没有必要去满足别人的期待。"
  summary: 追求他人的认可必然导致按照他人价值观生活。真正的自由是放下对认可的执着，即使不被表扬也做自己认为正确的事。认可欲求源于课题分离不清——别人的评价是别人的课题。
  tags: ["认可欲求", "他人期待", "自主人生", "课题分离"]

- id: p08
  title: 横向关系——虽不同但平等，不表扬不批评
  type: principle
  source_chapter: 39 批评不好 表扬也不行 / 40 有鼓励才有勇气
  source_quote: "表扬这种行为含有'有能力者对没能力者所做的评价'这方面的特点。我们表扬或者批评他人，只有'用糖'还是'用鞭子'的区别，其背后的目的都是操纵。阿德勒心理学反对一切纵向关系，提倡把所有的人际关系都看作横向关系——虽不同但平等。"
  summary: 一切"评价"（无论是表扬还是批评）都隐含上下级关系。应建立基于"虽不同但平等"的横向关系，用感谢（非表扬）和鼓励（非批评）来交流。评价是操纵，感谢才是尊重。
  tags: ["横向关系", "纵向关系", "平等", "评价", "鼓励"]

- id: p09
  title: 存在即有价值——用存在标准而非行为标准看人
  type: principle
  source_chapter: 42 只要存在着，就有价值
  source_quote: "请不要用行为标准，而是用存在标准去看待他人。不要用他人'做了什么'去判断，而应该对其存在本身表示喜悦和感谢。我们仅仅因为'存在于这里'，就已经对他人有用、有价值了。"
  summary: 人的价值不取决于做了什么（行为标准），而在于"存在"本身（存在标准）。卧病在床的老人、婴儿，仅仅活着就是对家人的支撑。从理想形象的100分扣分，不如从0起点看存在本身的价值。
  tags: ["存在价值", "无条件接纳", "行为标准", "生命价值"]

- id: p10
  title: 共同体感觉三支柱——自我接纳·他者信赖·他者贡献
  type: checklist
  source_chapter: 45 不是肯定自我，而是接纳自我 / 46 信用和信赖有何区别 / 47 工作的本质是对他人的贡献
  source_quote: "建立共同体感觉需要从以下三点做起：自我接纳、他者信赖和他者贡献。"
  summary: "共同体感觉的达成需三个步骤：（1）自我接纳——诚实地接受60分的自己，努力做到100分，而非自欺欺人地说'我能行'；（2）他者信赖——无条件相信他人，不附带抵押或条件，背叛与否是对方的课题；（3）他者贡献——感受到自己对他人有用，贡献不必可见，贡献感本身即是幸福。三者环环相扣：接纳自我才能信赖他人，信赖他人才能贡献，贡献后反过来接纳自我。"
  tags: ["自我接纳", "他者信赖", "他者贡献", "共同体感觉", "幸福"]

- id: p11
  title: 幸福即贡献感——不需要他人认可的贡献感
  type: assertion
  source_chapter: 51 从这一刻起，就能变得幸福
  source_quote: "幸福即贡献感。只要能够产生'我对他人有用'的主观感觉即贡献感，就可以获得幸福。贡献感不需要他人认可，一旦需要他人认可，就失去了自由。"
  summary: 幸福的本质是"贡献感"——主观上感受到自己对他人有用。这种感受不需要通过他人的表扬或认可来确认。如果贡献感必须依靠他人认可才能获得，就等于把幸福的决定权交给了别人。
  tags: ["幸福", "贡献感", "认可欲求", "主观价值"]

- id: p12
  title: 甘于平凡的勇气——不必非要做"特别的存在"
  type: principle
  source_chapter: 52 甘于平凡的勇气
  source_quote: "为什么非要特别呢？这是因为无法接受普通的自己。但是普通和平凡真的不好吗？实际上谁都是普通人。普通并不等于无能。我们根本没必要特意炫耀自己的优越性。"
  summary: 人常陷入"特别优秀"或"特别差劲"的二选一执念。两者目的相同——成为"特别的存在"。但甘于平凡也是一种勇气。普通≠无能，接受普通才能免于活在虚假的优越或自卑中。
  tags: ["平凡", "特别", "优越性追求", "自我接纳"]

- id: p13
  title: 人生是连续的刹那——认真活在"此时此刻"
  type: rule
  source_chapter: 54 人生是一连串的刹那 / 56 对决"人生最大的谎言"
  source_quote: "请不要把人生理解为一条线，而要理解成点的连续。人生是连续的刹那。我们只能活在'此时此刻'。人生最大的谎言就是不活在'此时此刻'，纠结过去、关注未来，把微弱而模糊的光打向人生整体。"
  summary: 人生不是从起点到终点的线，而是连续的当下瞬间。把人生当作登山（以山顶为目标）会把大部分人生当作"在路上"的临时阶段。应如跳舞——每个刹那本身即是目的。不纠结过去，不空想未来，认真过好此时此刻。
  tags: ["此时此刻", "当下", "刹那", "过程即目的", "人生谎言"]

- id: p14
  title: 人生的意义由你自己赋予——必须有人开始
  type: assertion
  source_chapter: 57 人生的意义，由你自己决定
  source_quote: "并不存在普遍性的人生意义。人生意义是自己赋予自己的。而且——必须有人开始。即使别人不合作，那也与你无关。我的意见就是这样：应该由你开始，不用去考虑别人是否合作。"
  summary: 人生没有普适的客观意义，每个人需自己赋予。改变的起点永远是自己，不要等待他人先行动。"必须有人开始"——如果你不开始改变，世界永远不会为你改变。一个人的力量无穷大。
  tags: ["人生意义", "自主决定", "开始改变", "主动性"]

- id: p15
  title: 行为与心理双重目标框架
  type: checklist
  source_chapter: 48 年轻人也有胜过长者之处
  source_quote: "行为方面的目标：（1）自立；（2）与社会和谐共处。支撑这种行为的心理方面的目标：（1）'我有能力'的意识；（2）'人人都是我的伙伴'的意识。"
  summary: 阿德勒心理学提出的完整人生目标框架：行为层面需达成"自立"和"与社会和谐共处"；心理层面需建立"我有能力"和"人人都是我的伙伴"的意识。前者对应自我接纳，后者对应他者信赖与他者贡献。
  tags: ["人生目标", "自立", "社会和谐", "能力感", "伙伴意识"]
