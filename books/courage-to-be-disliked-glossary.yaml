glossary:
- id: g01
  term: 目的论
  type: term
  source_chapter: 03 再怎么找原因，也没法改变一个人
  author_definition: 阿德勒心理学考虑的不是过去的原因，而是现在的目的。你并不是受怒气支配而大发雷霆，完全是为了大发雷霆而制造怒气。
  key_distinction: 常识认为过去的原因导致现在的行为（因果论），但阿德勒认为现在的目的决定了行为——人是为达成某个目的而主动选择行为的。愤怒不是失控，而是为了震慑对方而捏造的手段。
  why_it_matters: 阿德勒心理学的认识论基础。下游skill若沿用因果论分析用户行为，就会落入决定论陷阱。
  tags:
  - 核心框架
  - 方法论
- id: g02
  term: 心理创伤并不存在
  type: term
  source_chapter: 04 心理创伤并不存在
  author_definition: 任何经历本身并不是成功或者失败的原因。决定我们自身的不是过去的经历，而是我们自己赋予经历的意义。
  key_distinction: 常识认为心理创伤是客观存在的伤害会必然导致心理问题，但阿德勒认为同一经历不同人有不同解读，决定人生方向的是你赋予经历的意义。
  why_it_matters: 用户常以原生家庭创伤来解释困境。若下游skill接受这种归因，就等于认可了过去决定现在。
  tags:
  - 核心主张
  - 反弗洛伊德
- id: g03
  term: 课题分离
  type: term
  source_chapter: 30 把自己和别人的人生课题分开来
  author_definition: 关于自己的人生你能够做的就只有选择自己认为最好的道路。别人如何评价你的选择，那是别人的课题，你根本无法左右。一切人际关系矛盾都起因于对别人的课题妄加干涉。
  key_distinction: 常识认为关心他人就要介入帮忙给建议，但阿德勒认为干涉别人的课题恰恰是人际冲突的根源。划清的标准是：这件事的最终后果由谁承担。
  why_it_matters: 最具操作性的工具。用户有人际困扰时，第一反应应是帮用户做课题分离。
  tags:
  - 实操工具
  - 人际关系
- id: g04
  term: 共同体感觉
  type: term
  source_chapter: 35 人际关系的终极目标
  author_definition: 把他人看作伙伴并能够从中感到自己有位置的状态，就叫共同体感觉。共同体感觉是幸福的人际关系的最重要的指标。
  key_distinction: 常识中的共同体指家庭学校公司等小团体；阿德勒的共同体范围无限大——包括国家人类过去未来甚至动植物与非生物。归属感需主动参与才能获得。
  why_it_matters: 阿德勒心理学的终极目标。下游skill评估用户幸福感时要衡量用户是否感受到对他人有用的贡献感。
  tags:
  - 终极目标
  - 幸福感
- id: g05
  term: 自卑感 / 自卑情结
  type: term
  source_chapter: 13-14 自卑感来自主观的臆造 / 自卑情结只是一种借口
  author_definition: 自卑感：在德语中是价值更少的感觉，可以成为促成努力和进步的契机。自卑情结：把自己的自卑感当作某种借口使用的状态，即因为A所以才做不到B的外部因果律。
  key_distinction: 常识中二者混用，但阿德勒严格区分：自卑感人人都有且可以是健康的成长催化剂；自卑情结是把自卑感作为不行动的借口。
  why_it_matters: 用户说我很自卑时，下游skill需判断是健康的自卑感还是病态的自卑情结。
  tags:
  - 概念澄清
  - 常见误区
- id: g06
  term: 横向关系 / 纵向关系
  type: term
  source_chapter: 38-39 批评不好 表扬也不行 / 有鼓励才有勇气
  author_definition: 纵向关系：有上下等级、评价与被评价的关系（表扬批评本质都是操纵）。横向关系：虽不同但平等的关系，不评价他人，而是真诚地感谢尊敬或喜悦。阿德勒心理学反对一切纵向关系。
  key_distinction: 常识认为表扬是好的教育方式，但阿德勒认为表扬和批评是一体两面——都基于有能力者评价没能力者的纵向关系，目的都是操纵。
  why_it_matters: 下游skill在做鼓励反馈时，必须避免评价性语言（你做得好），改用感谢类语言（谢谢帮了大忙）。
  tags:
  - 人际关系
  - 平等
- id: g07
  term: 他者贡献
  type: term
  source_chapter: 47 工作的本质是对他人的贡献
  author_definition: 对作为伙伴的他人给予影响做出贡献。他者贡献并不是舍弃我而为他人效劳，反而是为了能够体会到我的价值而采取的一种手段。幸福即贡献感。
  key_distinction: 常识认为贡献就是自我牺牲利他行为，但阿德勒说贡献是为了体会自我价值的一种手段。贡献可以是看不见的贡献，只要有主观的我对他人有用的感觉即可。
  why_it_matters: 幸福的定义。下游skill帮用户寻找人生意义时，应引导用户建立贡献感。
  tags:
  - 幸福感
  - 三大支柱
- id: g08
  term: 自我接纳
  type: term
  source_chapter: 44 不是肯定自我，而是接纳自我
  author_definition: 假如做不到就诚实地接受这个做不到的自己，然后尽量朝着能够做到的方向去努力，不对自己撒谎。这就是自我接纳。
  key_distinction: 自我肯定（明明做不到仍暗示我能行）是虚假的积极；自我接纳（承认我只能得60分然后努力到61分）是诚实的达观。
  why_it_matters: 下游skill若混淆二者，可能给出错误建议——让用户相信自己可以而非接受现状后的改进。
  tags:
  - 三大支柱
  - 达观
- id: g09
  term: 他者信赖
  type: term
  source_chapter: 45 信用和信赖有何区别
  author_definition: 在相信他人的时候不附加任何条件。即使没有足以构成信用的客观依据也依然相信，无条件地相信——这就是信赖。
  key_distinction: 信用是有条件的——因为你靠谱所以我信你；信赖是完全无条件的信任。常识认为无条件信任容易被骗，但阿德勒说决定背不背叛是对方的课题。
  why_it_matters: 用户常因害怕被背叛而不敢深交。下游skill需引导用户用课题分离理解信任。
  tags:
  - 三大支柱
  - 无条件信任
- id: g10
  term: 认可欲求
  type: term
  source_chapter: 36 拼命寻求认可反而是以自我为中心
  author_definition: 一味在意他人怎么样的生活方式正是只关心我的自我中心式的生活方式。受认可欲求束缚的人看似在看着他人，但实际上眼里只有自己。
  key_distinction: 常识认为在意别人看法是为他人着想，但阿德勒说这恰恰是最极端的以自我为中心——因为你满脑子想的都是我怎么被看待。
  why_it_matters: 用户常把在意他人看法归因为善良。下游skill必须指出这实际上是自我中心。
  tags:
  - 自我中心
  - 反常识
- id: g11
  term: 此时此刻
  type: term
  source_chapter: 53-54 人生是一连串的刹那 / 舞动人生
  author_definition: 请不要把人生理解为一条线，而要理解成点的连续。人生是连续的刹那，我们只能活在此刻，我们的人生只存在于刹那之中。
  key_distinction: 常识把人生看作登山——到达山顶才算成功。阿德勒说人生是跳舞——每一个瞬间都是完整的，没有目的地，认真跳好当下本身就是目的。
  why_it_matters: 用户常说等XX之后我就幸福了。下游skill必须引导用户关注此时此刻的完满性。
  tags:
  - 时间观
  - 活在当下
- id: g12
  term: 人生谎言
  type: term
  source_chapter: 56 对决人生最大的谎言
  author_definition: 人生中最大的谎言就是不活在此刻。纠结过去关注未来，把微弱而模糊的光打向人生整体，自认为看到了些什么。
  key_distinction: 常识认为回顾过去规划未来是成熟的表现，但阿德勒认为这是最大的自我欺骗——用过去创伤或未来目标解释当下的不行动。
  why_it_matters: 用户最常用的借口就是因为过去所以现在。下游skill需识别这些人生谎言模式。
  tags:
  - 自我欺骗
  - 行动力
- id: g13
  term: 存在标准 / 行为标准
  type: term
  source_chapter: 42 只要存在着，就有价值
  author_definition: 请不要用行为标准，而是用存在标准去看待他人。不要用他人做了什么去判断，而应该对其存在本身表示喜悦和感谢。
  key_distinction: 常识用做了什么来评价一个人的价值（行为标准），但阿德勒说人只要活着就有价值（存在标准）。卧床的老人婴儿虽然做不了什么，但活着本身就有意义。
  why_it_matters: 用户普遍用行为标准衡量自我价值。下游skill需帮用户建立存在标准的视角。
  tags:
  - 价值标准
  - 无条件价值
- id: g14
  term: 优越性追求
  type: term
  source_chapter: 14 自卑情结只是一种借口
  author_definition: 人是作为一种无力的存在活在这个世界上，并且人希望摆脱这种无力状态，继而有了普遍欲求。阿德勒称其为追求优越性，可以理解为希望进步或追求理想状态。
  key_distinction: 常识把优越感理解为凌驾于他人之上的欲望，但阿德勒的优越性追求是指人类普遍的自我完善欲望，与竞争他人无关。
  why_it_matters: 用户常把追求优越性误解为竞争攀比。下游skill应引导用户：优越性是自我成长而非打败他人。
  tags:
  - 人性论
  - 进取心
- id: g15
  term: 被讨厌的勇气
  type: term
  source_chapter: 33 对认可的追求，扼杀了自由
  author_definition: 不害怕被别人讨厌、不追求他人认可、按照自己的方式去生活的勇气。人际关系中自由的代价就是被别人讨厌。
  key_distinction: 常识认为被讨厌是坏事需要尽量避免。但阿德勒认为被讨厌是自由生活的必然代价——不害怕被讨厌，恰恰是真正自由的标志。
  why_it_matters: 全书的标题和灵魂。下游skill面对用户的社交恐惧时，最终答案不是如何让更多人喜欢你，而是你有没有勇气被讨厌。
  tags:
  - 核心命题
  - 自由
  - 勇气
