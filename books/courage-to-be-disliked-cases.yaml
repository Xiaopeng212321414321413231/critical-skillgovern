    summary: "哲人举例的青年：梦想成为小说家，但总以工作忙为由不写，从不投稿参赛。实质是害怕面对作品拙劣、被淘汰的现实，用'如果有时间我也可以'的幻想来保留可能性，回避真正的挑战。"
    bound_to: "你的人生取决于'当下'（摒弃'如果怎样怎样'的假设）"
    outcome: "未提及后续，但哲人指出：一直不投稿就不会发展，但只有直面课题才可能成长。"
