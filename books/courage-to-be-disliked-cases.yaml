    source_quote: "我有位朋友外是一位非常开朗的男士，即使和陌生人也能谈得来。他深受大家的喜爱……而我就是一个不善与人交往的人。"
    summary: "青年分享自己的对比：朋友'外'开朗外向人见人爱，而自己不善交际。青年很想变成外那样的人，认为自己如果像他那样就会幸福。哲人指出其本质是不爱自己、希望通过变成别人来逃避自卑。"
