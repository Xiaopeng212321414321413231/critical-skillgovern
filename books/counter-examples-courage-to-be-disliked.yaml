counter_examples:
  - id: ce01
    title: 原因论的陷阱 — 过去决定论
    type: counter-example
    source_chapter: 02-03
    source_quote: "如果一味地关注过去的原因，企图仅仅靠原因去解释事物，那就会陷入决定论。也就是说，最终会得出这样的结论：我们的现在甚至未来全部都由过去的事情所决定，而且根本无法改变。"
    failure_mode: 用过去的原因来解释现在的困境，陷入因果决定论的思维陷阱
    mechanism: 原因论让人认为"现在的我是由过去决定的"，从而放弃改变的可能性。这是弗洛伊德式因果律的典型应用。
    warning_signs:
      - "经常说'因为过去发生过XX，所以我现在才这样'"
      - "用过去的遭遇作为不改变的理由"
      - "认为'过去无法改变，所以我的人生就这样了'"
    bound_to:
      - "ce02 心理创伤的误信"
      - "ce03 认可欲求的陷阱"
    tags:
      - 原因论
      - 决定论
      - 弗洛伊德
      - 因果关系
      - 改变障碍

  - id: ce02
    title: 心理创伤的误信 — 创伤决定命运
    type: counter-example
    source_chapter: 03-04
    source_quote: "任何经历本身并不是成功或者失败的原因。我们并非因为自身经历中的刺激（所谓的心理创伤）而痛苦。事实上我们会从经历中发现符合自己目的的因素。决定我们自身的不是过去的经历，而是我们自己赋予经历的意义。"
    failure_mode: 认为过去的心理创伤直接决定了现在的痛苦和不幸，把当下的不幸福归咎于不可改变的过去事件
    mechanism: 将当下的问题归因于过去的创伤事件（如虐待、歧视、失败），以此逃避面对当前人生课题的责任。本质是为"不改变"找借口。
    warning_signs:
      - "把当前所有问题都追溯到某个过去事件"
      - "反复诉说自己过去的创伤经历"
      - "认为'只要过去不一样，我现在就会幸福'"
    bound_to:
      - "ce01 原因论的陷阱"
      - "ce07 人生谎言"
    tags:
      - 心理创伤
      - 创伤后应激
      - 归因谬误
      - 受害者心态

  - id: ce03
    title: 认可欲求的陷阱 — 活在别人的期待中
    type: counter-example
    source_chapter: 24-27
    source_quote: "过于希望得到别人的认可，就会按照别人的期待去生活。也就是舍弃真正的自我，活在别人的人生之中。"
    failure_mode: 过度寻求他人认可，牺牲自我意志以迎合他人的期待
    mechanism: 受赏罚教育影响，形成"做对的事→被表扬→有价值"的条件反射。最终以他人评价作为自我价值的唯一标准，丧失自由和主体性。
    warning_signs:
      - "做任何事之前先想'别人会怎么看我'"
      - "被批评就极度沮丧，被表扬才感到有动力"
      - "难以做出不符合父母/上司/伴侣期待的决定"
      - "八面玲珑地讨好所有人"
    bound_to:
      - "ce05 自卑情结的滥用"
      - "ce08 纵向关系/赏罚教育陷阱"
      - "ce09 追求特别的误区"
    tags:
      - 认可欲求
      - 他人期待
      - 自我丧失
      - 自由
      - 赏罚教育

  - id: ce04
    title: 愤怒作为控制工具的滥用
    type: counter-example
    source_chapter: 04-05
    source_quote: "所谓愤怒其实只是可放可收的一种手段而已。它既可以在接电话的瞬间巧妙地收起，也可以在挂断电话之后再次释放出来。这位母亲并不是因为怒不可遏而大发雷霆，她只不过是为了用高声震慑住女儿，进而使其听自己的话，才采用了愤怒这种感情。"
    failure_mode: 用愤怒情绪作为强迫他人服从的工具，以为"忍不住发火"是不可控的自然反应
    mechanism: 愤怒不是不可抗力的情绪爆发，而是为了达成某种目的（使对方屈服、震慑）而被主动"制造"出来的手段。用愤怒代替了理性沟通。
    warning_signs:
      - "经常说'忍不住发火'或'控制不住脾气'"
      - "发火后对方听话了就不再生气"
      - "对不同的人/场合区别性地发火"
      - "只对特定对象（下属/孩子/伴侣）容易发怒"
    bound_to:
      - "ce06 权力斗争与复仇"
      - "ce08 纵向关系陷阱"
    tags:
      - 愤怒管理
      - 情绪工具化
      - 权力斗争
      - 沟通失败

  - id: ce05
    title: 自卑情结的滥用 — "因为有A所以做不到B"
    type: counter-example
    source_chapter: 14-15
    source_quote: "自卑情结是指把自己的自卑感当作某种借口使用的状态。具体就像'我因为学历低所以无法成功'或者'我因为长得不漂亮所以结不了婚'之类的想法。像这样在日常生活中大肆宣扬'因为有A所以才做不到B'这样的理论，这已经超出了自卑感的范畴，它是一种自卑情结。"
    failure_mode: 用"我因为XX所以做不到XX"的因果关系来逃避行动和改变
    mechanism: 将客观条件（学历、外貌、出身、年龄）作为自己不行动的借口，本质是不愿面对努力后的失败风险。把外部因素当作"免罪符"来维持虚假的可能性。
    warning_signs:
      - "常说'只要我有XX，我也能做到'"
      - "把失败归因于环境而不是自己的选择"
      - "沉浸在'如果...就好了'的假设中"
      - "看到别人成功时想'要是我有他的条件，我也行'"
    bound_to:
      - "ce01 原因论的陷阱"
      - "ce07 人生谎言"
      - "ce10 如果假设陷阱"
    tags:
      - 自卑情结
      - 借口心理学
      - 外部因果律
      - 自我设限

  - id: ce06
    title: 优越情结与夸耀不幸 — 虚假的优越感
    type: counter-example
    source_chapter: 15-16
    source_quote: "那些想要骄傲于自我攻击的人，那些沉迷于过去的荣光整天只谈自己曾经的辉煌业绩的人......特意自吹自擂的人其实是对自己没有自信。阿德勒明确指出：如果有人骄傲自大，那一定是因为他有自卑感。"
    failure_mode: 用虚假的优越感（权势张扬、夸耀不幸、炫耀过去）来掩盖深层的自卑感
    mechanism: 无法通过健全的努力克服自卑感，转而用简易方式制造"我很特别"的假象：① 炫耀权势/名牌/关系；② 沉迷过去荣光；③ 夸耀自己的不幸以获取特殊关注。
    warning_signs:
      - "频繁谈论过去的辉煌成就"
      - "把名牌/地位/关系挂在嘴边"
      - "用自己的不幸经历来博取同情或压制他人"
      - "把'你无法理解我的痛苦'当作挡箭牌"
      - "十根手指都戴满戒指之类的外在炫耀"
    bound_to:
      - "ce05 自卑情结的滥用"
      - "ce09 追求特别的误区"
    tags:
      - 优越情结
      - 虚假优越感
      - 夸耀不幸
      - 自卑补偿

  - id: ce07
    title: 人生谎言 — 转嫁责任逃避课题
    type: counter-example
    source_chapter: 22-23
    source_quote: "阿德勒把这种企图设立种种借口来回避人生课题的情况叫做'人生谎言'。对于自己目前所处的状态，把责任转嫁给别人，通过归咎于他人或者环境来回避人生课题。"
    failure_mode: 设立各种借口（讨厌的上司、不幸的家庭、糟糕的环境）来逃避工作、交友和爱的三大人生课题
    mechanism: 先有"不想面对某个人际关系"的目的，再为此目的寻找或捏造对方的缺点作为"合理"理由。本质是对自己撒谎，也对周围人撒谎。
    warning_signs:
      - "总有一个'坏上司'/'坏同事'来解释工作不顺"
      - "认为'没有XX我就能做得更好'"
      - "与某人关系恶化后能详细罗列对方的缺点"
      - "把人生不如意完全归因于具体某个人"
    bound_to:
      - "ce03 认可欲求的陷阱"
      - "ce05 自卑情结的滥用"
      - "ce10 如果假设陷阱"
    tags:
      - 人生谎言
      - 逃避课题
      - 责任转嫁
      - 自我欺骗
      - 借口

  - id: ce08
    title: 纵向关系陷阱 — 批评不行表扬也不行
    type: counter-example
    source_chapter: 38-39
    source_quote: "我们表扬或者批评他人，只有'用糖'还是'用鞭'的区别，其背后的目的都是操纵。阿德勒心理学之所以强烈否定赏罚教育，就因为它是为了操纵孩子。"
    failure_mode: 在人际关系中建立纵向的上下级关系，用评价性的语言（表扬或批评）操纵他人
    mechanism: 表扬和批评都是基于"有能力者评价无能力者"的纵向关系思维。表扬让人形成"没能力→渴望被表扬→迎合评价者标准"的依赖模式，反而削弱了勇气和主体性。
    warning_signs:
      - "习惯用'你真棒'/'做得很好'/'真了不起'来鼓励人"
      - "认为没有表扬就没有动力"
      - "人际交往中总在比较谁高谁低"
      - "把'为你好'挂在嘴上"
      - "用'因为我是你上司/父母'作为要求服从的理由"
    bound_to:
      - "ce03 认可欲求的陷阱"
      - "ce04 愤怒控制工具"
    tags:
      - 纵向关系
      - 赏罚教育
      - 操纵心理
      - 评价语言
      - 横向关系缺失

  - id: ce09
    title: 追求特别的误区 — 从"特别优秀"到"特别差劲"
    type: counter-example
    source_chapter: 50-51
    source_quote: "大多数孩子在最初的阶段都是希望'特别优秀'......但是希望特别优秀的愿望无法实现的时候......就会转而希望'特别差劲'。无论是希望特别优秀还是希望特别差劲，其目的都一样——引起他人的关注、脱离普通状态、成为'特别的存在'。"
    failure_mode: 无法接受"普通"的自己，要么追求特别优秀（成功），要么追求特别差劲（问题行为），用极端方式寻求关注
    mechanism: 优越性追求（希望进步）的扭曲变形。当无法通过健康努力达到"特别优秀"时，转而通过问题行为（逃学、割腕、暴力等）获得"廉价优越性追求"——至少是特别的存在。
    warning_signs:
      - "要么做到最好要么完全不做"
      - "无法接受自己只是普通人的现实"
      - "用问题行为来获取注意力"
      - "非黑即白的自我评价"
      - "认为平凡的人生没有价值"
    bound_to:
      - "ce05 自卑情结的滥用"
      - "ce06 优越情结"
      - "ce11 线性人生观的陷阱"
    tags:
      - 追求特别
      - 廉价优越性
      - 问题行为
      - 甘于平凡
      - 非黑即白

  - id: ce10
    title: "如果...就好了"的假设陷阱 — 活在可能性中
    type: counter-example
    source_chapter: 10-11
    source_quote: "活在'如果怎样怎样'之类的假设之中，就根本无法改变。因为'如果可以变成Y那样的人'正是你为自己不做改变找的借口。"
    failure_mode: 用"如果我有时间/条件/机会，我就能XX"的假设性思维来回避实际行动，维持"可能性"的幻想
    mechanism: 保留"如果做的话我也可以"的可能性，以避免面对"做了但失败"的现实打击。不投稿就不会落选，不告白就不会被拒绝，不行动就不会有失败的风险。
    warning_signs:
      - "长期说'如果有时间我就写小说/创业/学习'"
      - "从未真正尝试但坚信自己有某方面的才能"
      - "把行动推迟到'条件成熟'的那一天"
      - "年龄增长后用'现在太晚了'作为新借口"
    bound_to:
      - "ce05 自卑情结的滥用"
      - "ce07 人生谎言"
      - "ce11 线性人生观的陷阱"
    tags:
      - 假设思维
      - 拖延症
      - 可能性陷阱
      - 行动障碍

  - id: ce11
    title: 线性人生观的陷阱 — 把人生当作"在路上"
    type: counter-example
    source_chapter: 52-55
    source_quote: "把人生当作登山的人，其实是把自己的人生看成了一条线......到达顶点，最终迎来死这一终点。但是这种把人生理解为故事的想法，与弗洛伊德式的原因论紧密相关，而且会把人生的大半时光当作'在路上'。"
    failure_mode: 认为人生只有"到达目标"才能真正开始，把"此时此刻"当作到达目标前的忍耐和准备阶段
    mechanism: 将人生设定为一条有终点的线（好大学→好工作→幸福），导致：① 把当下的每个瞬间都降格为手段而非目的；② 若未达目标则否定整个人生价值；③ 活在等待中而非体验中。
    warning_signs:
      - "经常说'等XX之后我就幸福了'"
      - "把当下当作忍辱负重的过渡期"
      - "认为没有达成目标的人生就是失败的"
      - "总是眺望未来而忽视眼前"
      - "无法享受过程本身的乐趣"
    bound_to:
      - "ce01 原因论的陷阱"
      - "ce10 如果假设陷阱"
    tags:
      - 线性人生
      - 目标至上
      - 拖延幸福
      - 理想化未来
      - 此时此刻
