    summary: "哲人举例说明'外部因果律'：有人将自己的婚姻失败归因于幼时父母离婚。从弗洛伊德原因论看，这是心灵创伤的因果；但从阿德勒目的论看，这是将本无必然因果关系的事情编织成因果关系，用作不结婚的借口。"
    bound_to: "自卑情结 vs 自卑感 / 外部因果律"
